name: CI/CD

# Aufbau wie bei aquaconfig: Test → Image bauen (GHCR) → Deploy per SSH.
# Pull-Requests werden nur geprüft; erst ein Push auf main veröffentlicht und deployt.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Läufe auf main nie abbrechen, sonst bleibt ein Deploy halb stehen
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Lint, Typen, Unit-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  e2e:
    name: Build und End-to-End-Tests
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    env:
      DATABASE_URL: file:${{ github.workspace }}/data/ci.db
      PAYLOAD_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      SERVER_URL: http://localhost:3000
      SEED_ON_INIT: 'true'
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ci-admin-passwort
      RATE_LIMIT_INQUIRIES: '100'
      PAYLOAD_DB_PUSH: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Migrationen passen zum Datenmodell
        run: |
          npx payload migrate:create ci-check --skip-empty
          if [ -n "$(git status --porcelain src/migrations)" ]; then
            echo "::error::Das Datenmodell wurde geändert, aber keine Migration erstellt. Bitte 'npm run migrate:create' ausführen und committen."
            git status --porcelain src/migrations
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Server starten (Standalone wie im Docker-Image)
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          cd .next/standalone
          SEED_IMAGES_DIR="$GITHUB_WORKSPACE/src/seed/images" MEDIA_DIR="$RUNNER_TEMP/media" NODE_ENV=production PORT=3000 \
            nohup node server.js > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health; then echo; echo "Server bereit"; exit 0; fi
            sleep 2
          done
          echo "::error::Server nicht erreichbar"
          cat "$RUNNER_TEMP/server.log"
          exit 1

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: End-to-End-Tests
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Server-Log
        if: always()
        run: cat "$RUNNER_TEMP/server.log" || true

      # Der Bericht ist eine Beigabe: Ein voller Artefakt-Speicher darf den Job nicht rot färben
      - name: Playwright-Bericht sichern
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Image bauen
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Imagename und Tags bestimmen
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="${GITHUB_SHA::8}"
          TAGS="$IMAGE:$TAG"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TAGS="$TAGS,$IMAGE:latest"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS"   >> "$GITHUB_OUTPUT"

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: An GHCR anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen, und außerhalb von PRs nach GHCR pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Plausible fließt beim Build in die Content-Security-Policy ein (Repository-Variablen)
          build-args: |
            PLAUSIBLE_DOMAIN=${{ vars.PLAUSIBLE_DOMAIN }}
            PLAUSIBLE_SCRIPT_URL=${{ vars.PLAUSIBLE_SCRIPT_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy nach Production
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    environment:
      name: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      # Ohne Server-Zugang bleibt es beim Image in GHCR – mit Hinweis statt rotem Lauf
      - name: Server-Zugang prüfen
        id: access
        run: |
          if [ -n "$SSH_PRIVATE_KEY" ] && [ -n "$SSH_HOST" ] && [ -n "$SSH_USER" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Deploy übersprungen::Secrets SSH_PRIVATE_KEY, SSH_HOST und SSH_USER fehlen (Environment production). Das Image liegt trotzdem in GHCR."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.access.outputs.ready == 'true'

      - name: SSH vorbereiten
        if: steps.access.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Container auf dem Server neu starten
        if: steps.access.outputs.ready == 'true'
        env:
          IMAGE: ${{ needs.docker.outputs.image }}:${{ needs.docker.outputs.tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Daten wie bei aquaconfig (/htdocs/lamprecht) als Verzeichnis auf dem Server
          APP_DIR: ${{ vars.APP_DIR || '/htdocs/mte' }}
          # Website auf Port 84 des Servers (aquaconfig: 83); HTTPS und Zertifikate macht nginx davor
          APP_PORT: ${{ vars.APP_PORT || '84' }}
          APP_BIND: ${{ vars.APP_BIND }}
        run: |
          {
            printf 'export REGISTRY_USER=%q REGISTRY_TOKEN=%q APP_DIR=%q APP_PORT=%q APP_BIND=%q\n' \
              "$REGISTRY_USER" "$REGISTRY_TOKEN" "$APP_DIR" "$APP_PORT" "$APP_BIND"
            cat deploy/deploy.sh
          } | ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" bash -s -- "$IMAGE"
