name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, Typen, Unit-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  e2e:
    name: Build und End-to-End-Tests
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    env:
      DATABASE_URL: file:${{ github.workspace }}/data/ci.db
      PAYLOAD_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      SERVER_URL: http://localhost:3000
      SEED_ON_INIT: 'true'
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ci-admin-passwort
      RATE_LIMIT_INQUIRIES: '100'
      PAYLOAD_DB_PUSH: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Migrationen passen zum Datenmodell
        run: |
          npx payload migrate:create ci-check --skip-empty
          if [ -n "$(git status --porcelain src/migrations)" ]; then
            echo "::error::Das Datenmodell wurde geändert, aber keine Migration erstellt. Bitte 'npm run migrate:create' ausführen und committen."
            git status --porcelain src/migrations
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Server starten (Standalone wie im Docker-Image)
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          cd .next/standalone
          SEED_IMAGES_DIR="$GITHUB_WORKSPACE/src/seed/images" MEDIA_DIR="$RUNNER_TEMP/media" NODE_ENV=production PORT=3000 \
            nohup node server.js > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health; then echo; echo "Server bereit"; exit 0; fi
            sleep 2
          done
          echo "::error::Server nicht erreichbar"
          cat "$RUNNER_TEMP/server.log"
          exit 1

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: End-to-End-Tests
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Server-Log
        if: always()
        run: cat "$RUNNER_TEMP/server.log" || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    name: Docker-Image bauen
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: schaftboeller-ebner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
