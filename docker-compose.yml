# Schaftböller Ebner – Betrieb mit Docker Compose
#
#   cp .env.example .env.production   # Werte ausfüllen
#   docker compose --env-file .env.production up -d --build
#   # mit automatischem HTTPS (Caddy): docker compose --env-file .env.production --profile tls up -d --build
#
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: schaftboeller
      POSTGRES_USER: schaftboeller
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U schaftboeller -d schaftboeller']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        PLAUSIBLE_DOMAIN: ${PLAUSIBLE_DOMAIN:-}
        PLAUSIBLE_SCRIPT_URL: ${PLAUSIBLE_SCRIPT_URL:-}
    image: schaftboeller-ebner:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://schaftboeller:${POSTGRES_PASSWORD}@db:5432/schaftboeller
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - media:/app/media

  caddy:
    image: caddy:2-alpine
    profiles: ['tls']
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:-schaftboeller-ebner.at}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
